<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 340px;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(160deg, #0f0c29, #302b63);
      color: #fff;
      min-height: 100px;
    }

    /* ── Header ── */
    .header {
      padding: 16px 20px 12px;
      background: rgba(255,255,255,0.06);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      display: flex; align-items: center; gap: 10px;
    }
    .header-icon { font-size: 26px; animation: hbounce 2s ease-in-out infinite; }
    @keyframes hbounce {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-4px); }
    }
    .header-title { font-size: 15px; font-weight: 800; }
    .header-sub   { font-size: 11px; color: rgba(255,255,255,0.45); margin-top: 2px; }

    /* ── Auth section ── */
    #auth-section {
      padding: 24px 20px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .auth-label { font-size: 13px; color: rgba(255,255,255,0.6); text-align: center; }
    .pin-wrapper { display: flex; gap: 8px; }

    input[type="password"] {
      flex: 1; padding: 10px 14px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.08); color: #fff;
      font-size: 18px; letter-spacing: 6px; outline: none; transition: border 0.2s;
    }
    input[type="password"]:focus { border-color: #0a84ff; }
    input[type="password"]::placeholder { font-size: 13px; letter-spacing: 0; color: rgba(255,255,255,0.3); }

    .btn-unlock {
      padding: 10px 16px; background: linear-gradient(90deg,#065fd4,#0a84ff);
      color: #fff; border: none; border-radius: 10px;
      font-size: 13px; font-weight: 700; cursor: pointer; transition: transform 0.15s;
    }
    .btn-unlock:hover { transform: scale(1.04); }
    #error { font-size: 12px; color: #ff6b6b; text-align: center; min-height: 16px; font-weight: 600; }

    /* ── Main section ── */
    #main-section { display: none; flex-direction: column; }

    /* ── Tabs ── */
    .tabs {
      display: flex; border-bottom: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
    }
    .tab-btn {
      flex: 1; padding: 10px 4px; font-size: 11px; font-weight: 700;
      color: rgba(255,255,255,0.4); background: none; border: none;
      cursor: pointer; letter-spacing: 0.5px; text-transform: uppercase;
      border-bottom: 2px solid transparent; transition: all 0.2s;
    }
    .tab-btn.active { color: #0a84ff; border-bottom-color: #0a84ff; }
    .tab-btn:hover:not(.active) { color: rgba(255,255,255,0.7); }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── Status bar ── */
    .status-bar {
      background: rgba(0,255,120,0.08);
      border-bottom: 1px solid rgba(0,255,120,0.15);
      padding: 7px 16px; font-size: 11px; color: rgba(0,255,160,0.85);
      display: flex; align-items: center; gap: 6px;
    }
    .status-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #00ff88; box-shadow: 0 0 6px #00ff88; flex-shrink: 0;
    }

    /* ── Keywords tab ── */
    .add-row {
      display: flex; gap: 8px; padding: 14px 16px 8px;
    }
    input[type="text"] {
      flex: 1; padding: 9px 12px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.08); color: #fff;
      font-size: 13px; outline: none; transition: border 0.2s;
    }
    input[type="text"]:focus { border-color: #0a84ff; }
    input[type="text"]::placeholder { color: rgba(255,255,255,0.3); }

    .btn-add {
      padding: 9px 12px; background: linear-gradient(90deg,#065fd4,#0a84ff);
      color: #fff; border: none; border-radius: 10px;
      font-size: 13px; font-weight: 700; cursor: pointer;
    }
    .btn-add:hover { opacity: 0.9; }

    .section-label {
      padding: 2px 16px 6px; font-size: 10px; font-weight: 700;
      letter-spacing: 1.2px; color: rgba(255,255,255,0.35); text-transform: uppercase;
    }

    #keyword-list {
      list-style: none; padding: 0 10px; margin: 0;
      max-height: 170px; overflow-y: auto;
    }
    #keyword-list::-webkit-scrollbar { width: 4px; }
    #keyword-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

    #keyword-list li {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.08);
      padding: 7px 10px; border-radius: 10px; margin-bottom: 5px; font-size: 13px;
    }
    #keyword-list li:hover { background: rgba(255,255,255,0.11); }
    .kw-badge { display: inline-flex; align-items: center; gap: 6px; }
    .kw-dot { width: 6px; height: 6px; border-radius: 50%; background: #ff6b6b; box-shadow: 0 0 5px #ff6b6b; }

    #keyword-list li button {
      background: rgba(255,80,80,0.15); color: #ff6b6b; border: none;
      border-radius: 6px; width: 24px; height: 24px; font-size: 13px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    #keyword-list li button:hover { background: rgba(255,80,80,0.35); }

    /* ── Screen Time tab ── */
    .time-panel { padding: 16px; }

    .usage-ring-wrap {
      display: flex; flex-direction: column; align-items: center;
      margin-bottom: 16px; gap: 6px;
    }
    .usage-ring {
      position: relative; width: 100px; height: 100px;
    }
    .usage-ring svg { transform: rotate(-90deg); }
    .usage-ring-bg { fill: none; stroke: rgba(255,255,255,0.1); stroke-width: 8; }
    .usage-ring-fg {
      fill: none; stroke: #0a84ff; stroke-width: 8;
      stroke-linecap: round; stroke-dasharray: 251.2;
      stroke-dashoffset: 251.2; transition: stroke-dashoffset 0.6s ease;
    }
    .usage-ring-text {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      text-align: center;
    }
    .usage-mins { font-size: 22px; font-weight: 800; color: #fff; line-height: 1; }
    .usage-label { font-size: 10px; color: rgba(255,255,255,0.4); }
    .usage-subtext { font-size: 12px; color: rgba(255,255,255,0.5); }

    .limit-row {
      display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
    }
    .limit-row label { font-size: 12px; color: rgba(255,255,255,0.6); flex-shrink: 0; }

    input[type="number"] {
      width: 72px; padding: 8px 10px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.08); color: #fff;
      font-size: 14px; font-weight: 700; outline: none; text-align: center;
    }
    input[type="number"]:focus { border-color: #0a84ff; }

    .limit-hint { font-size: 11px; color: rgba(255,255,255,0.35); }

    .btn-sm {
      padding: 7px 14px; border-radius: 8px; font-size: 12px; font-weight: 700;
      cursor: pointer; border: none; transition: opacity 0.2s;
    }
    .btn-sm:hover { opacity: 0.85; }
    .btn-save { background: linear-gradient(90deg,#065fd4,#0a84ff); color: #fff; }
    .btn-reset { background: rgba(255,80,80,0.2); border: 1px solid rgba(255,80,80,0.3); color: #ff6b6b; }

    .time-actions { display: flex; gap: 8px; margin-top: 4px; }

    /* ── Schedule tab ── */
    .sched-panel { padding: 14px 16px; }
    .sched-panel h3 { font-size: 12px; color: rgba(255,255,255,0.5); margin-bottom: 10px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }

    .day-row { display: flex; gap: 5px; margin-bottom: 12px; }
    .day-btn {
      flex: 1; padding: 6px 2px; border-radius: 7px; font-size: 10px; font-weight: 700;
      border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.4); cursor: pointer; text-align: center; transition: all 0.2s;
    }
    .day-btn.on { background: rgba(10,132,255,0.3); border-color: #0a84ff; color: #fff; }

    .time-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .time-row label { font-size: 12px; color: rgba(255,255,255,0.5); width: 40px; flex-shrink: 0; }

    input[type="time"] {
      padding: 7px 10px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.08); color: #fff;
      font-size: 13px; font-weight: 600; outline: none;
      color-scheme: dark;
    }
    input[type="time"]:focus { border-color: #0a84ff; }

    .sched-hint { font-size: 11px; color: rgba(255,255,255,0.3); margin-bottom: 12px; line-height: 1.5; }

    .sched-windows { margin-top: 10px; }
    .sched-window-item {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 9px; padding: 8px 10px; margin-bottom: 6px; font-size: 12px;
    }
    .sched-window-item .sched-days { color: #0a84ff; font-weight: 700; font-size: 11px; }
    .sched-window-item .sched-time { color: rgba(255,255,255,0.7); }
    .sched-window-item button {
      background: rgba(255,80,80,0.15); color: #ff6b6b; border: none;
      border-radius: 6px; width: 22px; height: 22px; font-size: 12px; cursor: pointer;
    }

    .no-windows { font-size: 12px; color: rgba(255,255,255,0.3); text-align: center; padding: 10px 0; }

    /* ── Footer ── */
    .footer {
      padding: 10px 16px 14px;
      display: flex; flex-direction: column; gap: 7px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    #status { font-size: 11px; color: #00e676; text-align: center; min-height: 14px; font-weight: 600; }
    .btn-lock {
      padding: 9px; background: rgba(200,0,0,0.2);
      border: 1px solid rgba(255,80,80,0.3); color: #ff6b6b;
      border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer;
    }
    .btn-lock:hover { background: rgba(200,0,0,0.4); }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-icon">🛡️</div>
    <div>
      <div class="header-title">KidGuard for YouTube</div>
      <div class="header-sub">Parental control — v1.1</div>
    </div>
  </div>

  <!-- Auth -->
  <div id="auth-section">
    <div class="auth-label">🔒 Parent access required</div>
    <div class="pin-wrapper">
      <input type="password" id="pin-input" placeholder="Enter PIN" maxlength="8" />
      <button class="btn-unlock" id="unlock-btn">Unlock</button>
    </div>
    <div id="error"></div>
  </div>

  <!-- Main -->
  <div id="main-section">

    <div class="status-bar">
      <div class="status-dot"></div>
      KidGuard is active and protecting
    </div>

    <!-- Tab buttons -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="keywords">🚫 Keywords</button>
      <button class="tab-btn" data-tab="time">⏱ Screen Time</button>
      <button class="tab-btn" data-tab="schedule">📅 Schedule</button>
    </div>

    <!-- ── KEYWORDS TAB ── -->
    <div class="tab-panel active" id="tab-keywords">
      <div class="add-row">
        <input type="text" id="new-keyword" placeholder="Add keyword to block..." />
        <button class="btn-add" id="add-btn">+ Add</button>
      </div>
      <div class="section-label">Blocked Keywords</div>
      <ul id="keyword-list"></ul>
    </div>

    <!-- ── SCREEN TIME TAB ── -->
    <div class="tab-panel" id="tab-time">
      <div class="time-panel">
        <div class="usage-ring-wrap">
          <div class="usage-ring">
            <svg width="100" height="100" viewBox="0 0 100 100">
              <circle class="usage-ring-bg" cx="50" cy="50" r="40"/>
              <circle class="usage-ring-fg" id="usage-ring-fg" cx="50" cy="50" r="40"/>
            </svg>
            <div class="usage-ring-text">
              <div class="usage-mins" id="usage-mins-display">0</div>
              <div class="usage-label">min today</div>
            </div>
          </div>
          <div class="usage-subtext" id="usage-subtext">No daily limit set</div>
        </div>

        <div class="limit-row">
          <label>Daily limit</label>
          <input type="number" id="limit-input" min="0" max="600" placeholder="0" />
          <span class="limit-hint">minutes &nbsp;(0 = off)</span>
        </div>

        <div class="time-actions">
          <button class="btn-sm btn-save" id="save-limit-btn">Save Limit</button>
          <button class="btn-sm btn-reset" id="reset-usage-btn">Reset Today</button>
        </div>
      </div>
    </div>

    <!-- ── SCHEDULE TAB ── -->
    <div class="tab-panel" id="tab-schedule">
      <div class="sched-panel">
        <h3>Add Blocked Window</h3>

        <div class="day-row" id="day-row">
          <button class="day-btn" data-day="0">Sun</button>
          <button class="day-btn on" data-day="1">Mon</button>
          <button class="day-btn on" data-day="2">Tue</button>
          <button class="day-btn on" data-day="3">Wed</button>
          <button class="day-btn on" data-day="4">Thu</button>
          <button class="day-btn on" data-day="5">Fri</button>
          <button class="day-btn" data-day="6">Sat</button>
        </div>

        <div class="time-row">
          <label>From</label>
          <input type="time" id="sched-start" value="21:00" />
        </div>
        <div class="time-row">
          <label>To</label>
          <input type="time" id="sched-end" value="07:00" />
        </div>
        <div class="sched-hint">YouTube will be blocked on selected days between these hours.</div>

        <button class="btn-sm btn-save" id="add-window-btn" style="width:100%;padding:9px;">+ Add Window</button>

        <div class="sched-windows">
          <div class="section-label" style="padding:10px 0 6px;">Active Windows</div>
          <div id="window-list"></div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <div id="status"></div>
      <button class="btn-lock" id="lock-btn">🔒 Lock Settings</button>
    </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
